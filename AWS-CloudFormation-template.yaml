AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Deploy Mail-in-a-Box (Ubuntu 26.04 ARM64 fork) on EC2 t4g.micro with S3 backups,
  Nextcloud S3 support, and optional AWS SES SMTP Relay.

Parameters:
  MailInABoxDomain:
    Description: DNS Domain to host emails for
    Type: String
  InstanceEIP:
    Description: Elastic IP of Instance (leave empty to auto-assign)
    Type: String
    Default: ''
  BackupS3Bucket:
    Description: S3 bucket to use for backups
    Type: String
  NextCloudS3Bucket:
    Description: S3 bucket to use for Nextcloud data (optional)
    Default: ''
    Type: String
  KeyName:
    Description: 'Mandatory: Name of an existing EC2 key pair'
    Type: AWS::EC2::KeyPair::KeyName
    ConstraintDescription: Must be the name of an existing EC2 KeyPair.
  InstanceType:
    Description: EC2 instance type (ARM64 Graviton)
    Type: String
    Default: t4g.micro
    AllowedValues: [t4g.nano, t4g.micro, t4g.small, t4g.medium]
  InstanceAMI:
    Description: Official Canonical Ubuntu 26.04 LTS (Resolute Raccoon) ARM64 SSM Parameter
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: '/aws/service/canonical/ubuntu/server/26.04/stable/current/arm64/hvm/ebs-gp3/ami-id'
  InstanceDns:
    Description: Hostname prefix within MailInABoxDomain (e.g., box)
    Type: String
    Default: box
  MailInABoxBranchOrTag:
    Description: Branch or Tag to checkout from your custom fork
    Type: String
    Default: aws-cf
  MailInABoxCloneUrl:
    Description: Git repository URL for your Mail-in-a-Box 26.04 fork
    Type: String
    Default: https://github.com/microgov/Mail-in-a-box-26
  MailInABoxAdminPassword:
    Description: Initial admin password (leave empty to auto-generate and save to SSM)
    Type: String
    NoEcho: true
    Default: ''
  RestoreKey:
    Description: Key to decrypt backup (leave empty to generate new or load from SSM)
    Type: String
    Default: ''
    NoEcho: true
  RestoreKeySsmParameterName:
    Description: SSM Parameter name to store/retrieve the backup encryption key
    Default: 'MailInABoxRestoreKey'
    Type: String
  RestorePrefix:
    Description: S3 prefix of backup to restore (leave empty for a fresh install)
    Default: ''
    Type: String
  SesRelay:
    Description: Configure AWS SES as outbound SMTP relay
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
  SmtpIamAccessKeyVersion:
    Type: Number
    Default: 1
    MinValue: 1
    Description: Increment to rotate IAM SMTP access keys.

Conditions:
  InstanceEIPProvided: !Not [!Equals [!Ref InstanceEIP, '']]
  NextCloudS3: !Not [!Equals [!Ref NextCloudS3Bucket, '']]
  UseSesRelay: !Equals [!Ref SesRelay, 'true']
  RestoreKeyInSsmParameter: !Not [!Equals [!Ref RestoreKeySsmParameterName, '']]
  NewAdminPasswordToSsm: !And
    - !Equals [!Ref MailInABoxAdminPassword, '']
    - !Equals [!Ref RestorePrefix, '']

Resources:
  InstanceEIPAssociation:
    Type: AWS::EC2::EIPAssociation
    Condition: InstanceEIPProvided
    Properties:
      EIP: !Ref InstanceEIP
      InstanceId: !Ref EC2Instance

  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security Group for Mail-in-a-Box Instance
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 22, ToPort: 22, CidrIp: 0.0.0.0/0, Description: SSH }
        - { IpProtocol: tcp, FromPort: 25, ToPort: 25, CidrIp: 0.0.0.0/0, Description: SMTP }
        - { IpProtocol: tcp, FromPort: 53, ToPort: 53, CidrIp: 0.0.0.0/0, Description: DNS TCP }
        - { IpProtocol: udp, FromPort: 53, ToPort: 53, CidrIp: 0.0.0.0/0, Description: DNS UDP }
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0, Description: HTTP }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: HTTPS }
        - { IpProtocol: tcp, FromPort: 143, ToPort: 143, CidrIp: 0.0.0.0/0, Description: IMAP STARTTLS }
        - { IpProtocol: tcp, FromPort: 465, ToPort: 465, CidrIp: 0.0.0.0/0, Description: SMTPS }
        - { IpProtocol: tcp, FromPort: 587, ToPort: 587, CidrIp: 0.0.0.0/0, Description: SMTP Submission }
        - { IpProtocol: tcp, FromPort: 993, ToPort: 993, CidrIp: 0.0.0.0/0, Description: IMAPS }
        - { IpProtocol: tcp, FromPort: 4190, ToPort: 4190, CidrIp: 0.0.0.0/0, Description: ManageSieve }

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub MailInABoxInstanceRole-${AWS::StackName}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CloudFormationSignal
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: cloudformation:SignalResource
                Resource: '*'
        - PolicyName: BackupS3BucketAccessMIAB
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: 's3:*'
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::${BackupS3Bucket}/*
                  - !Sub arn:${AWS::Partition}:s3:::${BackupS3Bucket}
        - !If
          - NextCloudS3
          - PolicyName: NextCloudS3Policy
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action: 's3:*'
                  Resource:
                    - !Sub arn:${AWS::Partition}:s3:::${NextCloudS3Bucket}/*
                    - !Sub arn:${AWS::Partition}:s3:::${NextCloudS3Bucket}
          - !Ref AWS::NoValue
        - !If
          - UseSesRelay
          - PolicyName: SsmParameterAccessSmtpCredentials
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action: ssm:GetParameter
                  Resource:
                    - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/smtp-username-${AWS::StackName}
                    - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/smtp-password-${AWS::StackName}
          - !Ref AWS::NoValue
        - !If
          - RestoreKeyInSsmParameter
          - PolicyName: SsmParameterAccessRestoreKey
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - ssm:PutParameter
                    - ssm:GetParameter
                  Resource:
                    - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${RestoreKeySsmParameterName}
                - Effect: Allow
                  Action: ssm:DescribeParameters
                  Resource: '*'
          - !Ref AWS::NoValue
        - !If
          - NewAdminPasswordToSsm
          - PolicyName: SsmParameterAccessMailInABoxAdminPassword
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action: ssm:PutParameter
                  Resource:
                    - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/MailInABoxAdminPassword
          - !Ref AWS::NoValue

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub MailInABoxInstanceProfile-${AWS::StackName}
      Roles:
        - !Ref InstanceRole

  MailInABoxAdminPasswordSsmParameter:
    Condition: NewAdminPasswordToSsm
    Type: AWS::SSM::Parameter
    Properties:
      Name: /MailInABoxAdminPassword
      Type: String
      Value: DefaultToBeUpdatedByInstaller
      Description: Initial admin Password for Mail-in-a-Box WebUI

  EC2Instance:
    Type: AWS::EC2::Instance
    DependsOn: SmtpCredentialsWaitCondition
    CreationPolicy:
      ResourceSignal:
        Timeout: PT45M
        Count: 1
    Properties:
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      ImageId: !Ref InstanceAMI
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        HttpPutResponseHopLimit: 1
      IamInstanceProfile: !Ref InstanceProfile
      SecurityGroups:
        - !Ref InstanceSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeType: gp3
            VolumeSize: 20
            DeleteOnTermination: true
            Encrypted: true
      Tags:
        - Key: Name
          Value: !Sub MailInABoxInstance-${AWS::StackName}
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash -xe
          exec > >(tee /var/log/user-data.log | logger -t user-data -s 2>/dev/console) 2>&1

          # 1. Establish System Identity
          export PRIMARY_HOSTNAME="${InstanceDns}.${MailInABoxDomain}"
          hostnamectl set-hostname "$PRIMARY_HOSTNAME"
          echo "127.0.1.1 $PRIMARY_HOSTNAME ${InstanceDns}" >> /etc/hosts
          echo "${MailInABoxDomain}" > /etc/mailname

          # 2. Add 2GB Swap (Critical for t4g.micro 1GB RAM during Nextcloud/SpamAssassin setup)
          fallocate -l 2G /swapfile
          chmod 600 /swapfile
          mkswap /swapfile
          swapon /swapfile
          echo '/swapfile none swap sw 0 0' >> /etc/fstab

          # 3. Core OS Dependencies & PEP 668 Compliant cfn-bootstrap venv
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -y
          apt-get upgrade -o DPkg::Lock::Timeout=120 -y
          apt-get install -o DPkg::Lock::Timeout=120 -y \
              python3-venv python3-pip python3-boto3 python3-gpg \
              curl git jq unzip cloud-guest-utils

          python3 -m venv /opt/aws/cfn-bootstrap-venv
          /opt/aws/cfn-bootstrap-venv/bin/pip install --upgrade pip
          #
          # /opt/aws/cfn-bootstrap-venv/bin/pip install http://amazonaws.com
          /opt/aws/cfn-bootstrap-venv/bin/pip install --quiet --no-cache-dir https://s3.amazonaws.com/cloudformation-examples/aws-cfn-bootstrap-py3-latest.tar.gz
          mkdir -p /opt/aws/bin
          ln -sf /opt/aws/cfn-bootstrap-venv/bin/cfn-* /opt/aws/bin/
          # Install AWS CLI v2 (ARM64 compatible via uname -m)
          cd /tmp
          # curl -fsSL "amazonaws.com(uname -m).zip" -o awscliv2.zip
          curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-$(uname -m).zip" -o awscliv2.zip
          unzip -q awscliv2.zip
          ./aws/install
          export PATH=$PATH:/usr/local/bin:/opt/aws/bin
          hash -r
          # Ensure CloudFormation is signaled on exit/failure
          trap '/opt/aws/bin/cfn-signal -e $? --stack ${AWS::StackName} --resource EC2Instance --region ${AWS::Region}' EXIT

          # 4. Query IMDSv2 Metadata Safely (replaces deprecated ec2metadata)
          # Get a token (valid for 6 hours)
          IMDS_TOKEN=$(curl -s -X PUT "http://169.254.169.254/latest/api/token" \
              -H "X-aws-ec2-metadata-token-ttl-seconds: 21600")

          # Function to fetch metadata using the token
          get_metadata() {
          curl -s -H "X-aws-ec2-metadata-token: $IMDS_TOKEN" \
          "http://169.254.169.254/latest/meta-data/$1"
          }

          export PRIVATE_IP=$(get_metadata "local-ipv4")
          export INSTANCE_ID=$(get_metadata "instance-id")
          if [[ -z "${InstanceEIP}" ]]; then
          export PUBLIC_IP=$(get_metadata "public-ipv4")
          else
          export PUBLIC_IP="${InstanceEIP}"
          fi

          # 5. Mail-in-a-Box Unattended Environment Variables
          export NONINTERACTIVE=1
          export SKIP_NETWORK_CHECKS=1
          export STORAGE_ROOT=/home/user-data
          export STORAGE_USER=user-data
          export PUBLIC_IPV6=""
          export PRIVATE_IPV6=""
          export MTA_STS_MODE=enforce
          export EMAIL_ADDR="admin@${MailInABoxDomain}"
          if [[ -z "${MailInABoxAdminPassword}" ]]; then
            export EMAIL_PW=$(tr -dc A-Za-z0-9 </dev/urandom | head -c 16 ; echo '')
            if [[ -z "${RestorePrefix}" ]]; then
              aws ssm put-parameter \
                  --overwrite \
                  --name "/MailInABoxAdminPassword" \
                  --type SecureString \
                  --value "$EMAIL_PW"
            fi
          else
            export EMAIL_PW="${MailInABoxAdminPassword}"
          fi
          if [[ -n "${NextCloudS3Bucket}" ]]; then
            export NEXTCLOUD_S3_BUCKET="${NextCloudS3Bucket}"
            export NEXTCLOUD_S3_REGION=$(aws s3api get-bucket-location --bucket "$NEXTCLOUD_S3_BUCKET" --query 'LocationConstraint' --output text)
            [[ "$NEXTCLOUD_S3_REGION" == "None" ]] && NEXTCLOUD_S3_REGION=us-east-1
          fi
          if [[ "${SesRelay}" == "true" ]]; then
            export SMTP_RELAY_ENDPOINT="email-smtp.${AWS::Region}.amazonaws.com"
            export SMTP_RELAY_PORT=587
            export SMTP_RELAY_USER=$(aws ssm get-parameter --name "/smtp-username-${AWS::StackName}" --with-decryption --query Parameter.Value --output text)
            export SMTP_RELAY_PASSWORD=$(aws ssm get-parameter --name "/smtp-password-${AWS::StackName}" --with-decryption --query Parameter.Value --output text)
          fi

          # 6. Clone Custom Fork & Checkout Target Branch/Tag
          id -u $STORAGE_USER &>/dev/null || useradd -m $STORAGE_USER
          mkdir -p $STORAGE_ROOT
          git clone "${MailInABoxCloneUrl}" /opt/mailinabox
          ln -s /opt/mailinabox /root/mailinabox
          cd /opt/mailinabox && git checkout "${MailInABoxBranchOrTag}"

          # 7. Restore from S3 Backup (if RestorePrefix is provided)
          if [[ -n "${RestorePrefix}" ]]; then
            apt-get install -o DPkg::Lock::Timeout=120 -y duplicity
            export S3_URL="s3://${BackupS3Bucket}/${RestorePrefix}"
          if [[ -n "${RestoreKey}" ]]; then
            export PASSPHRASE_FULL="${RestoreKey}"
          elif [[ -n "${RestoreKeySsmParameterName}" ]]; then
            PASSPHRASE_FULL=$(aws ssm get-parameter --name "/${RestoreKeySsmParameterName}" --with-decryption --query Parameter.Value --output text)
          else
            echo "Either RestoreKey or RestoreKeySsmParameterName must be set when restoring."
            exit 1
          fi
          export PASSPHRASE=$(echo "$PASSPHRASE_FULL" | awk '{print $1}')
          duplicity restore --force "$S3_URL" "$STORAGE_ROOT"
          mkdir -p "$STORAGE_ROOT/backup"
          echo "$PASSPHRASE_FULL" | tr ' ' '\n' > "$STORAGE_ROOT/backup/secret_key.txt"
          fi

          # 8. Execute Mail-in-a-Box Setup
          cd /opt/mailinabox && setup/start.sh

          # 9. Configure Local DNS Resolution via Netplan
          INTERFACE=$(ip route list | grep default | grep -E 'dev (\w+)' -o | awk '{print $2}')
          cat <<EOT > /etc/netplan/99-custom-dns.yaml
          network:
            version: 2
            ethernets:
                $INTERFACE:
                  nameservers:
                    addresses: [127.0.0.1]
                  dhcp4-overrides:
                    use-dns: false
          EOT
          netplan apply

          # 10. Configure S3 Backups & Encryption Key
          export RESTORE_S3_REGION=$(aws s3api get-bucket-location --bucket "${BackupS3Bucket}" --query 'LocationConstraint' --output text)
          [[ "$RESTORE_S3_REGION" == "None" ]] && RESTORE_S3_REGION=us-east-1
          echo "Mail-in-a-box (${MailInABoxBranchOrTag}) backups for $INSTANCE_ID created on $(date -Im)" > /tmp/README.txt
          aws s3 cp /tmp/README.txt "s3://${BackupS3Bucket}/$INSTANCE_ID/README.txt"
          mkdir -p "$STORAGE_ROOT/backup"
          cat <<EOT > "$STORAGE_ROOT/backup/custom.yaml"
          min_age_in_days: 7
          # target: s3://s3.$RESTORE_S3_amazonaws.com{BackupS3Bucket}/$INSTANCE_ID
          target: s3://s3.$RESTORE_S3_REGION.amazonaws.com/${BackupS3Bucket}/$INSTANCE_ID
          target_user: ""
          target_pass: ""
          EOT
          #
          KEYFILE="$STORAGE_ROOT/backup/secret_key.txt"
          if [[ -z "${RestorePrefix}" ]]; then
            if [[ -n "${RestoreKey}" ]]; then
              echo "${RestoreKey}" | tr ' ' '\n' > "$KEYFILE"
            elif [[ -n "${RestoreKeySsmParameterName}" ]]; then
              restore_key_param_exists="$(aws ssm describe-parameters --filters "Key=Name,Values=/${RestoreKeySsmParameterName}" --query Parameters --output text)"
              if [[ -n "$restore_key_param_exists" ]]; then
                aws ssm get-parameter --name "/${RestoreKeySsmParameterName}" --with-decryption --query Parameter.Value --output text | tr ' ' '\n' > "$KEYFILE"
              elif [[ -s "$KEYFILE" ]]; then
                aws ssm put-parameter \
                  --overwrite \
                  --name "/${RestoreKeySsmParameterName}" \
                  --type SecureString \
                  --value "$(tr '\n' ' ' < "$KEYFILE")"
              fi
            fi
          fi
          if [ ! -s "$KEYFILE" ]; then
          openssl rand -base64 32 | tr '/+' '_-' > "$KEYFILE"
          fi
          chmod 600 "$KEYFILE"
          export PASSPHRASE=$(head -n1 "$KEYFILE")

          # Signal CloudFormation success before running initial backup & reboot
          /opt/aws/bin/cfn-signal -e 0 --stack ${AWS::StackName} --resource EC2Instance --region ${AWS::Region}
          trap - EXIT
          export GPG_PASSPHRASE="$PASSPHRASE"
          /opt/mailinabox/management/backup.py || echo "Initial backup failed, cron will retry later"
          # Clean cloud-init secrets and reboot cleanly
          rm -f /var/lib/cloud/instances/$INSTANCE_ID/scripts/part-00* \
                /var/lib/cloud/instances/$INSTANCE_ID/user-data.txt* \
                /var/lib/cloud/instances/$INSTANCE_ID/obj.pkl
          reboot

  SmtpCredentialsWaitHandleUnconditional:
    Type: AWS::CloudFormation::WaitConditionHandle

  SmtpCredentialsWaitHandleConditional:
    Condition: UseSesRelay
    DependsOn: SmtpPassword
    Type: AWS::CloudFormation::WaitConditionHandle

  SmtpCredentialsWaitCondition:
    Type: AWS::CloudFormation::WaitCondition
    Properties:
      Handle: !If [UseSesRelay, !Ref SmtpCredentialsWaitHandleConditional, !Ref SmtpCredentialsWaitHandleUnconditional]
      Timeout: '1'
      Count: 0

  SmtpUserGroup:
    Condition: UseSesRelay
    Type: AWS::IAM::Group
    Properties:
      GroupName: !Sub SMTPUserGroup-${AWS::StackName}

  SmtpUser:
    Condition: UseSesRelay
    Type: AWS::IAM::User
    Properties:
      UserName: !Sub SMTPUser-${AWS::StackName}
      Groups:
        - !Ref SmtpUserGroup

  SmtpUserPolicy:
    Condition: UseSesRelay
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub SMTPUserPolicy-${AWS::StackName}
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: ses:SendRawEmail
            Resource: '*'
            Condition:
              StringLike:
                'ses:FromAddress': !Sub '*@${MailInABoxDomain}'
      Groups:
        - !Ref SmtpUserGroup

  SmtpUserAccessKey:
    Condition: UseSesRelay
    Type: AWS::IAM::AccessKey
    Properties:
      Serial: !Ref SmtpIamAccessKeyVersion
      Status: Active
      UserName: !Ref SmtpUser

  SmtpUsername:
    Condition: UseSesRelay
    Type: Custom::SmtpUsername
    Properties:
      ServiceToken: !GetAtt SmtpLambdaFunction.Arn
      Key: !Ref SmtpUserAccessKey
      ParameterType: username

  SmtpPassword:
    Condition: UseSesRelay
    DependsOn: SmtpUsername
    Type: Custom::SmtpPassword
    Properties:
      ServiceToken: !GetAtt SmtpLambdaFunction.Arn
      Key: !GetAtt SmtpUserAccessKey.SecretAccessKey
      ParameterType: password

  SmtpLambdaExecutionRole:
    Condition: UseSesRelay
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub SMTPLambdaExecutionRole-${AWS::StackName}
      Description: Role assumed by Lambda to generate SMTP credentials
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InlineSMTPLambdaExecutionRolePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:CreateLogGroup
                Resource: arn:aws:logs:*:*:*
              - Effect: Allow
                Action:
                  - ssm:PutParameter
                  - ssm:DeleteParameter
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/smtp-username-${AWS::StackName}
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/smtp-password-${AWS::StackName}

  SmtpLambdaFunction:
    Condition: UseSesRelay
    Type: AWS::Lambda::Function
    Properties:
      Description: Generates SES SMTP credentials and stores them in Parameter Store
      FunctionName: !Sub SMTPCredentialsLambdaFunction-${AWS::StackName}
      Handler: index.lambda_handler
      MemorySize: 128
      Role: !GetAtt SmtpLambdaExecutionRole.Arn
      Runtime: python3.14
      Timeout: 30
      Code:
        ZipFile: !Sub |
          import hmac
          import hashlib
          import base64
          import boto3
          import cfnresponse
          import logging
          import os

          logging.basicConfig(level=logging.INFO)
          log = logging.getLogger(__name__)
          region = os.environ['AWS_REGION']
          ssm = boto3.client('ssm', region_name=region)

          DATE = "11111111"
          SERVICE = "ses"
          MESSAGE = "SendRawEmail"
          TERMINAL = "aws4_request"
          VERSION = 0x04

          def sign(key, msg):
              return hmac.new(key, msg.encode('utf-8'), hashlib.sha256).digest()

          def calculate_key(secret_access_key, region_name):
              signature = sign(("AWS4" + secret_access_key).encode('utf-8'), DATE)
              signature = sign(signature, region_name)
              signature = sign(signature, SERVICE)
              signature = sign(signature, TERMINAL)
              signature = sign(signature, MESSAGE)
              signature_and_version = bytes([VERSION]) + signature
              return base64.b64encode(signature_and_version).decode('utf-8')

          def put_parameter(value, param_type):
              try:
                  ssm.put_parameter(
                      Name=f"smtp-{param_type}-${AWS::StackName}",
                      Description=f"SMTP {param_type} for email communications",
                      Value=value,
                      Type='SecureString',
                      Overwrite=True,
                      Tier='Standard'
                  )
                  return True
              except Exception as e:
                  log.error(f"Error putting parameter smtp-{param_type}-${AWS::StackName}: {e}")
                  return False

          def delete_smtp_credentials(param_type):
              try:
                  ssm.delete_parameter(Name=f"smtp-{param_type}-${AWS::StackName}")
                  return True
              except Exception as e:
                  log.error(f"Error deleting parameter smtp-{param_type}-${AWS::StackName}: {e}")
                  return False

          def lambda_handler(event, context):
              parameter_type = event['ResourceProperties']['ParameterType']
              parameter_arn = f"arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/smtp-{parameter_type}-${AWS::StackName}"
              key = event['ResourceProperties']['Key']
              req_type = event['RequestType']

              if req_type in ('Create', 'Update'):
                  val = key if parameter_type == 'username' else calculate_key(key, region)
                  proceed = put_parameter(val, parameter_type)
                  reason = f"{req_type}d SMTP {parameter_type}"
              elif req_type == 'Delete':
                  proceed = delete_smtp_credentials(parameter_type)
                  reason = f"Deleted SMTP {parameter_type}"
              else:
                  proceed = False
                  reason = f"Unsupported operation: {req_type}"

              status = cfnresponse.SUCCESS if proceed else cfnresponse.FAILED
              cfnresponse.send(event, context, status, {'Reason': reason}, parameter_arn)

Outputs:
  InstancePublicIp:
    Description: The Public IP of the Mail-in-a-Box instance
    Value: !GetAtt EC2Instance.PublicIp
  AdminPassword:
    Description: Name of the SSM Parameter containing the Admin Password to Mail-in-a-Box Web-UI
    Condition: NewAdminPasswordToSsm
    Value: !Ref MailInABoxAdminPasswordSsmParameter
  RestorePrefix:
    Description: The S3 prefix where backups are stored (matches EC2 Instance ID)
    Value: !Ref EC2Instance
